name: Estadísticas del README

on:
  schedule:
    - cron: "17 4 * * *"   # cada día a las 04:17 UTC
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: [".github/readme/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install fonttools brotli

      - name: Generar SVG
        env:
          # Opcional: crea el secreto STATS_TOKEN (token personal con permiso read:user)
          # para que cuenten también tus contribuciones privadas.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/readme/stats.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git commit -m "Actualiza estadísticas del README"
          git push
